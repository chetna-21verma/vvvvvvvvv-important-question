<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Important Question 👀</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      transition: background 0.5s;
    }

    .card {
      width: min(90%, 600px);
      padding: 45px 25px;
      text-align: center;
      background: rgba(255,255,255,0.92);
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      position: relative;
      z-index: 5;
    }

    h1 {
      font-size: clamp(2rem, 7vw, 4rem);
      margin: 0 0 15px;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      min-height: 70px;
    }

    button {
      border: none;
      padding: 15px 28px;
      border-radius: 999px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s;
    }

    #yes {
      background: #ff4d88;
      color: white;
    }

    #yes:hover {
      transform: scale(1.12);
    }

    #no {
      background: #ddd;
      color: #333;
      position: fixed;
      z-index: 10;
    }

    #message {
      margin-top: 25px;
      min-height: 30px;
      font-weight: bold;
      color: #ff3f7f;
    }

    .confetti {
      position: fixed;
      top: -20px;
      font-size: 25px;
      animation: fall linear forwards;
      z-index: 20;
      pointer-events: none;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    .shake {
      animation: shake 0.35s;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-12px); }
      40% { transform: translateX(12px); }
      60% { transform: translateX(-8px); }
      80% { transform: translateX(8px); }
    }

    #success {
      display: none;
      font-size: 1.5rem;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="card" id="card">
    <div id="question">
      <h1>🚨 IMPORTANT QUESTION 🚨</h1>

      <p>
        I have conducted extensive research,<br>
        consulted the stars,<br>
        and asked absolutely nobody else...
        <br><br>
        <strong>Will you go out with me? 👀👉👈</strong>
      </p>

      <div class="buttons">
        <button id="yes">YES 😌💖</button>
        <button id="no">NO 🙅</button>
      </div>

      <div id="message"></div>
    </div>

    <div id="success">
      🎉🎉🎉 YOU SAID YES 🎉🎉🎉
      <br><br>
      Excellent decision.
      <br>
      Your reward: <strong>me 😌</strong>
      <br><br>
      💖💐🍕✨
    </div>
  </div>

  <script>
    const noButton = document.getElementById("no");
    const yesButton = document.getElementById("yes");
    const message = document.getElementById("message");
    const card = document.getElementById("card");

    let attempts = 0;

    const messages = [
      "Nice try.",
      "HAHAHAHA no.",
      "You really thought that would work? 😭",
      "The button has chosen violence.",
      "STOP TRYING TO REJECT ME 😭",
      "That button is scared of you.",
      "NOPE. 🚫",
      "THE UNIVERSE SAID YES.",
      "Please reconsider your life choices.",
      "Why are you like this 💀",
      "I can do this all day.",
      "The 'No' button has resigned.",
      "At this point you're just bullying the button.",
      "Fine. I'll make it harder."
    ];

    function moveNoButton() {
      attempts++;

      const padding = 20;
      const maxX = window.innerWidth - noButton.offsetWidth - padding;
      const maxY = window.innerHeight - noButton.offsetHeight - padding;

      const x = Math.max(
        padding,
        Math.random() * maxX
      );

      const y = Math.max(
        padding,
        Math.random() * maxY
      );

      noButton.style.left = `${x}px`;
      noButton.style.top = `${y}px`;

      message.textContent =
        messages[Math.min(attempts - 1, messages.length - 1)];

      // Make YES increasingly irresistible.
      yesButton.style.transform = `scale(${1 + attempts * 0.025})`;

      // Occasionally make the page dramatically shake.
      if (attempts % 3 === 0) {
        card.classList.remove("shake");
        void card.offsetWidth;
        card.classList.add("shake");
      }

      // After enough attempts, the NO button starts lying.
      if (attempts >= 5) {
        noButton.textContent = "NO (maybe)";
      }

      if (attempts >= 9) {
        noButton.textContent = "PLEASE NO 😭";
      }

      if (attempts >= 13) {
        noButton.textContent = "I GIVE UP";
      }

      if (attempts >= 17) {
        noButton.textContent = "OK FINE 😭";
      }
    }

    // Runs away when the mouse gets close.
    noButton.addEventListener("mouseenter", moveNoButton);

    // Also runs away on touch.
    noButton.addEventListener("touchstart", function(e) {
      e.preventDefault();
      moveNoButton();
    });

    // Just in case they somehow manage to click it.
    noButton.addEventListener("click", function(e) {
      e.preventDefault();
      moveNoButton();
    });

    yesButton.addEventListener("click", () => {
      document.getElementById("question").style.display = "none";
      document.getElementById("success").style.display = "block";

      document.body.style.background =
        "linear-gradient(135deg, #a18cd1, #fbc2eb)";

      launchConfetti();
    });

    function launchConfetti() {
      const emojis = ["🎉", "💖", "💐", "✨", "🥳", "💕", "🍕", "🫶"];

      for (let i = 0; i < 120; i++) {
        const confetti = document.createElement("div");

        confetti.className = "confetti";
        confetti.textContent =
          emojis[Math.floor(Math.random() * emojis.length)];

        confetti.style.left =
          Math.random() * 100 + "vw";

        confetti.style.animationDuration =
          (2 + Math.random() * 4) + "s";

        confetti.style.animationDelay =
          Math.random() * 1.5 + "s";

        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 7000);
      }
    }

    // Start the NO button somewhere normal.
    noButton.style.position = "relative";
  </script>

</body>
</html>
